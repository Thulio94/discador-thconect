services:
  app:
    image: discador-piloto-app:latest
    build:
      context: .
      dockerfile: .docker/app/Dockerfile.production
    env_file:
      - ${ENV_FILE:-.env.production}
    working_dir: /var/www/html
    environment:
      # O banco do piloto ja foi inicializado. Migracoes devem ser executadas
      # como etapa controlada de deploy, nunca no boot do PHP-FPM.
      RUN_MIGRATIONS_ON_BOOT: "false"
    volumes:
      - app_storage:/var/www/html/storage
      - pbx_recordings:/var/www/html/storage/app/recordings
    networks:
      default:
        aliases:
          - pilot-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000, $$errno, $$error, 2); exit($$socket ? 0 : 1);'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin-bootstrap:
    image: discador-piloto-app:latest
    env_file:
      - ${ENV_FILE:-.env.production}
    command:
      - sh
      - -ec
      - |
        printf 'Initial admin credential synchronization: one-time forced run\n'
        INITIAL_ADMIN_SYNC_PASSWORD=true php artisan db:seed --class=SuperAdminSeeder --force
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  nginx:
    image: discador-piloto-nginx:latest
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile.production
    networks:
      - default
      - easypanel
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  mysql:
    image: mariadb:11.4
    env_file:
      - ${ENV_FILE:-.env.production}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/performance.cnf:/etc/mysql/conf.d/zz-discador-performance.cnf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    env_file:
      - ${ENV_FILE:-.env.production}
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  queue:
    image: discador-piloto-app:latest
    env_file:
      - ${ENV_FILE:-.env.production}
    command: php artisan queue:work --queue=default,notifications --tries=3 --timeout=90 --memory=256 --max-jobs=500
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
      - pbx_recordings:/var/www/html/storage/app/recordings
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue-telephony:
    image: discador-piloto-app:latest
    env_file:
      - ${ENV_FILE:-.env.production}
    command: php artisan queue:work --queue=telephony --tries=3 --timeout=30 --sleep=1 --memory=256 --max-jobs=1000
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue-imports:
    image: discador-piloto-app:latest
    env_file:
      - ${ENV_FILE:-.env.production}
    command: php artisan queue:work --queue=imports --tries=2 --timeout=1800 --memory=384 --max-jobs=20
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue-reports:
    image: discador-piloto-app:latest
    env_file:
      - ${ENV_FILE:-.env.production}
    command: php artisan queue:work --queue=reports --tries=2 --timeout=900 --memory=512 --max-jobs=20
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: discador-piloto-app:latest
    env_file:
      - ${ENV_FILE:-.env.production}
    command: php artisan schedule:work
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
      - pbx_recordings:/var/www/html/storage/app/recordings
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    image: discador-piloto-app:latest
    env_file:
      - ${ENV_FILE:-.env.production}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www/html
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      default:
        aliases:
          - pilot-reverb
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  asterisk:
    image: discador-piloto-asterisk:latest
    build:
      context: ./.docker/asterisk
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      ASTERISK_AMI_USERNAME: "${ASTERISK_AMI_USERNAME:-thconect}"
      ASTERISK_AMI_SECRET: "${ASTERISK_AMI_SECRET}"
      ASTERISK_RTP_START: "${ASTERISK_RTP_START:-10000}"
      ASTERISK_RTP_END: "${ASTERISK_RTP_END:-10199}"
      ASTERISK_EXTERNAL_MEDIA_ADDRESS: "${ASTERISK_EXTERNAL_MEDIA_ADDRESS}"
      ASTERISK_EXTERNAL_SIGNALING_ADDRESS: "${ASTERISK_EXTERNAL_SIGNALING_ADDRESS}"
      ASTERISK_EXTERNAL_SIGNALING_PORT: "${ASTERISK_EXTERNAL_SIGNALING_PORT:-5060}"
      ASTERISK_ENABLE_TLS: "${ASTERISK_ENABLE_TLS:-false}"
      ASTERISK_STUN_ADDRESS: "${ASTERISK_STUN_ADDRESS:-}"
    ports:
      - "${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10199}:${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10199}/udp"
    volumes:
      - pbx_runtime:/etc/asterisk/pjsip.d
      - pbx_recordings:/var/spool/asterisk/monitor/thconect
    networks:
      default:
        aliases:
          - pilot-asterisk
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  asterisk-bridge:
    image: discador-piloto-asterisk-bridge:latest
    build:
      context: ./services/asterisk-bridge
      dockerfile: Dockerfile
    user: "0:0"
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      BRIDGE_PORT: "8090"
      BRIDGE_SHARED_TOKEN: "${ASTERISK_BRIDGE_TOKEN}"
      BRIDGE_WEBHOOK_URL: "http://app/bridge/events"
      BRIDGE_WEBHOOK_SECRET: "${ASTERISK_BRIDGE_WEBHOOK_SECRET}"
      BRIDGE_STATE_KEY: "${ASTERISK_BRIDGE_STATE_KEY}"
      BRIDGE_STATE_PATH: /etc/asterisk/pjsip.d/thconect-bridge-state.enc
      ASTERISK_CONFIG_PATH: /etc/asterisk/pjsip.d/thconect-routes.conf
      ASTERISK_AGENT_CONFIG_PATH: /etc/asterisk/pjsip.d/thconect-agents.conf
      ASTERISK_AMI_HOST: asterisk
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USERNAME: "${ASTERISK_AMI_USERNAME:-thconect}"
      ASTERISK_AMI_SECRET: "${ASTERISK_AMI_SECRET}"
    volumes:
      - pbx_runtime:/etc/asterisk/pjsip.d
      - pbx_recordings:/recordings:ro
    depends_on:
      app:
        condition: service_healthy
      asterisk:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  redis_data:
  pbx_runtime:
  pbx_recordings:

networks:
  easypanel:
    external: true
