services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000, $$errno, $$error, 2); exit($$socket ? 0 : 1);'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: discador_thconect_nginx
    ports:
      - "${APP_PORT:-8087}:80"
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mysql:
    image: mariadb:11.4
    container_name: discador_thconect_mysql
    ports:
      - "${MYSQL_FORWARD_PORT:-3317}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-discador_thconect}"
      MYSQL_USER: "${DB_USERNAME:-discador}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-discador_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - discador_mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: discador_thconect_redis
    ports:
      - "${REDIS_FORWARD_PORT:-6387}:6379"
    volumes:
      - discador_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_queue
    command: php artisan queue:work --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: discadorthconect-app
    container_name: discador_thconect_scheduler
    command: php artisan schedule:work --no-interaction --quiet
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www/html
    ports:
      - "${REVERB_PORT:-8097}:8080"
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  discador_vendor:
  discador_mysql:
  discador_redis:
