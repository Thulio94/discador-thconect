services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
      - ./.docker/app/www.conf:/usr/local/etc/php-fpm.d/zz-discador.conf:ro
      - discador_asterisk_recordings:/var/www/html/storage/app/recordings
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000, $$errno, $$error, 2); exit($$socket ? 0 : 1);'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: discador_thconect_nginx
    ports:
      - "${APP_PORT:-8087}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mysql:
    image: mariadb:11.4
    container_name: discador_thconect_mysql
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_FORWARD_PORT:-3317}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-discador_thconect}"
      MYSQL_USER: "${DB_USERNAME:-discador}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-discador_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - discador_mysql:/var/lib/mysql
      - ./.docker/mysql/performance.cnf:/etc/mysql/conf.d/zz-discador-performance.cnf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 20s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: discador_thconect_redis
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_FORWARD_PORT:-6387}:6379"
    volumes:
      - discador_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_queue
    command: php artisan queue:work --queue=default,notifications --tries=3 --timeout=90 --max-jobs=500
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
      - discador_asterisk_recordings:/var/www/html/storage/app/recordings
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue-telephony:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    command: php artisan queue:work --queue=telephony --tries=3 --timeout=30 --sleep=1 --max-jobs=1000
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  queue-imports:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    command: php artisan queue:work --queue=imports --tries=2 --timeout=1800 --memory=384 --max-jobs=20
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  queue-reports:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    command: php artisan queue:work --queue=reports --tries=2 --timeout=900 --memory=512 --max-jobs=20
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  queue-media:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    command: php artisan queue:work --queue=media --tries=3 --timeout=600 --memory=256 --max-jobs=100
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
      - discador_asterisk_recordings:/var/www/html/storage/app/recordings
    depends_on:
      app: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  scheduler:
    image: discadorthconect-app
    container_name: discador_thconect_scheduler
    command: php artisan schedule:work --no-interaction --quiet
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www/html
    ports:
      - "${REVERB_BIND_ADDRESS:-127.0.0.1}:${REVERB_PORT:-8097}:8080"
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - discador_framework_cache:/var/www/html/storage/framework
      - discador_bootstrap_cache:/var/www/html/bootstrap/cache
      - ./.docker/app/php.ini:/usr/local/etc/php/conf.d/zz-discador.ini:ro
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  asterisk-bridge:
    build:
      context: ./services/asterisk-bridge
      dockerfile: Dockerfile
    container_name: discador_thconect_asterisk_bridge
    user: "0:0"
    environment:
      BRIDGE_PORT: 8090
      BRIDGE_SHARED_TOKEN: "${ASTERISK_BRIDGE_TOKEN:-}"
      BRIDGE_WEBHOOK_URL: "http://app/bridge/events"
      BRIDGE_WEBHOOK_SECRET: "${ASTERISK_BRIDGE_WEBHOOK_SECRET:-}"
      BRIDGE_STATE_KEY: "${ASTERISK_BRIDGE_STATE_KEY:-}"
      BRIDGE_STATE_PATH: /etc/asterisk/pjsip.d/thconect-bridge-state.enc
      ASTERISK_CONFIG_PATH: /etc/asterisk/pjsip.d/thconect-routes.conf
      ASTERISK_AGENT_CONFIG_PATH: /etc/asterisk/pjsip.d/thconect-agents.conf
      ASTERISK_AMI_HOST: asterisk
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USERNAME: "${ASTERISK_AMI_USERNAME:-thconect}"
      ASTERISK_AMI_SECRET: "${ASTERISK_AMI_SECRET:-change-me-before-real-calls}"
    depends_on:
      app:
        condition: service_healthy
      asterisk:
        condition: service_started
    volumes:
      - discador_asterisk_config:/etc/asterisk/pjsip.d
      - discador_asterisk_recordings:/recordings:ro
    restart: unless-stopped

  asterisk:
    build:
      context: ./.docker/asterisk
      dockerfile: Dockerfile
    container_name: discador_thconect_asterisk
    environment:
      ASTERISK_AMI_USERNAME: "${ASTERISK_AMI_USERNAME:-thconect}"
      ASTERISK_AMI_SECRET: "${ASTERISK_AMI_SECRET:-change-me-before-real-calls}"
      ASTERISK_RTP_START: "${ASTERISK_RTP_START:-10000}"
      ASTERISK_RTP_END: "${ASTERISK_RTP_END:-10199}"
      ASTERISK_EXTERNAL_MEDIA_ADDRESS: "${ASTERISK_EXTERNAL_MEDIA_ADDRESS:-}"
      ASTERISK_EXTERNAL_SIGNALING_ADDRESS: "${ASTERISK_EXTERNAL_SIGNALING_ADDRESS:-}"
      ASTERISK_EXTERNAL_SIGNALING_PORT: "${ASTERISK_EXTERNAL_SIGNALING_PORT:-5060}"
      ASTERISK_ENABLE_TLS: "${ASTERISK_ENABLE_TLS:-false}"
      ASTERISK_STUN_ADDRESS: "${ASTERISK_STUN_ADDRESS:-}"
    ports:
      - "${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10199}:${ASTERISK_RTP_START:-10000}-${ASTERISK_RTP_END:-10199}/udp"
    volumes:
      - discador_asterisk_config:/etc/asterisk/pjsip.d
      - discador_asterisk_recordings:/var/spool/asterisk/monitor/thconect
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  discador_vendor:
  discador_mysql:
  discador_redis:
  discador_framework_cache:
  discador_bootstrap_cache:
  discador_asterisk_config:
  discador_asterisk_recordings:
