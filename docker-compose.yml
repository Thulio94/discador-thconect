services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: discador_thconect_nginx
    ports:
      - "${APP_PORT:-8087}:80"
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mariadb:11.4
    container_name: discador_thconect_mysql
    ports:
      - "${MYSQL_FORWARD_PORT:-3317}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-discador_thconect}"
      MYSQL_USER: "${DB_USERNAME:-discador}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-discador_secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
    volumes:
      - discador_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: discador_thconect_redis
    ports:
      - "${REDIS_FORWARD_PORT:-6387}:6379"
    volumes:
      - discador_redis:/data

  queue:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_queue
    command: php artisan queue:work --tries=3 --timeout=90
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
    depends_on:
      - app
      - redis

  scheduler:
    image: discadorthconect-app
    container_name: discador_thconect_scheduler
    command: php artisan schedule:work
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
    depends_on:
      - app
      - mysql

  reverb:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    container_name: discador_thconect_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    working_dir: /var/www/html
    ports:
      - "${REVERB_PORT:-8097}:8080"
    volumes:
      - .:/var/www/html
      - discador_vendor:/var/www/html/vendor
    depends_on:
      - app
      - redis

volumes:
  discador_vendor:
  discador_mysql:
  discador_redis:
