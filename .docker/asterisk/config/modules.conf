[modules]
autoload=yes

; Browser agents register through the HTTPS reverse proxy at /sip-ws. Keep these
; explicit so a minimal Asterisk build cannot silently omit the WebSocket stack.
load => res_http_websocket.so
load => res_pjsip_transport_websocket.so

; These sample-backed modules are not used by the outbound dialer.
noload => cdr_custom.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_sqlite3_custom.so
noload => res_adsi.so
noload => app_adsiprog.so
noload => app_getcpeid.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
