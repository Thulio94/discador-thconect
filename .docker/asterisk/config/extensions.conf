[general]
static=yes
writeprotect=no

[thconect-outbound]
exten => s,1,NoOp(THCONECT outbound call ${THCONECT_CALL_ID})
 same => n,GotoIf($["${THCONECT_AGENT_EXTENSION}"=""]?invalid)
 same => n,GotoIf($[${REGEX("^[0-9]{4,5}$" ${THCONECT_AGENT_EXTENSION})}]?agent:invalid)
 same => n(agent),GotoIf($[${REGEX("^t[0-9]+-e[0-9]{4,5}$" ${THCONECT_AGENT_ENDPOINT})}]?endpoint:invalid)
 same => n(endpoint),Set(THCONECT_BATCH_ID=${IF($["${THCONECT_BATCH_ID}"=""]?single-${THCONECT_CALL_ID}:${THCONECT_BATCH_ID})})
 same => n,Set(GROUP(thconect-power-batch)=${THCONECT_BATCH_ID})
 same => n,GotoIf($[${GROUP_COUNT(${THCONECT_BATCH_ID}@thconect-power-batch)} > 1]?batch_lost)
 same => n,Set(GROUP(thconect-agent)=${THCONECT_AGENT_ENDPOINT})
 same => n,GotoIf($[${GROUP_COUNT(${THCONECT_AGENT_ENDPOINT}@thconect-agent)} > 1]?agent_busy)
 same => n,Set(THCONECT_RECORDING=/var/spool/asterisk/monitor/thconect/call-${THCONECT_CALL_ID}.wav)
 same => n,MixMonitor(${THCONECT_RECORDING},b)
 same => n,Dial(PJSIP/${THCONECT_AGENT_ENDPOINT},40,b(thconect-agent-spy^s^1(${THCONECT_AGENT_EXTENSION}))g)
 same => n,StopMixMonitor()
 same => n,Hangup()
 same => n(batch_lost),NoOp(Power batch already has a route answer)
 same => n,Hangup(17)
 same => n(agent_busy),NoOp(Agent already has a delivered call)
 same => n,Hangup(17)
 same => n(invalid),NoOp(Invalid or missing THCONECT agent extension)
 same => n,Hangup(28)

[thconect-agent-spy]
exten => s,1,Set(SPYGROUP=agent-${ARG1})
 same => n,Return()

[thconect-agent-denied]
exten => _X!,1,NoOp(Direct SIP dialing from agent endpoints is not allowed)
 same => n,Hangup(21)
